<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Quest — Adventure & Racing Training Games</title>
<style>
:root{--navy:#0d1b2a;--teal:#0f4c5c;--amber:#f77f00;--amber2:#fca311;--bg:#f6f8fa;--line:#e4e9ee;--ok:#2a9d5c;--bad:#d1495b}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
body{background:linear-gradient(180deg,#eef4f7,var(--bg));min-height:100vh;color:#1b2631}
[dir="rtl"] body{text-align:right}
.wrap{max-width:860px;margin:0 auto;padding:18px 14px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
h1{font-size:21px;color:var(--navy)}
.lang,.back{background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--teal);text-decoration:none;display:inline-block}
.back{display:none}
.xpbar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.xpbar b{color:var(--teal);font-size:15px}
.meter{flex:1;min-width:140px;height:9px;background:#edf1f4;border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--amber));border-radius:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:18px;padding:22px 18px;cursor:pointer;transition:.18s;position:relative}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(13,27,42,.13)}
.card .emo{font-size:42px}
.card h3{font-size:16px;margin:10px 0 6px;color:var(--navy)}
.card p{font-size:12.5px;color:#5c6b7a;line-height:1.5}
.g1{background:linear-gradient(135deg,#fff3e0,#ffd9a0)}
.g2{background:linear-gradient(135deg,#e3f2fd,#a9d0f7)}
.t1{background:linear-gradient(135deg,#e8f5e9,#c5e8ca)}
.t2{background:linear-gradient(135deg,#f3e5f5,#e0b8e8)}
.t3{background:linear-gradient(135deg,#fff8e1,#ffe9a8)}
.banner{margin-top:18px;background:#fff8ec;border:1px solid #f2dfb8;border-radius:14px;padding:13px 16px;font-size:12.5px;color:#8a6d1f;line-height:1.55}
#play{display:none}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.hud .box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:13.5px;font-weight:700;color:var(--navy)}
canvas{width:100%;height:auto;border-radius:18px;touch-action:none;display:block}
.hint{font-size:12px;color:#5c6b7a;text-align:center;margin-top:10px}
/* question overlay */
.overlay{position:fixed;inset:0;background:rgba(13,27,42,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.qcard{background:#fff;border-radius:20px;max-width:460px;width:100%;padding:24px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.qcard .gate{font-size:11.5px;letter-spacing:1.5px;color:var(--amber);font-weight:800;text-transform:uppercase}
.qcard .q{font-size:16.5px;font-weight:800;color:var(--navy);line-height:1.45;margin:10px 0 16px}
.opt{display:block;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:13px 15px;margin-bottom:9px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--teal)}
.opt.right{border-color:var(--ok);background:#eefaf2}
.opt.wrong{border-color:var(--bad);background:#fdeef0;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fbn{font-size:12.5px;color:#8a6d1f;background:#fff8ec;border:1px solid #f2dfb8;border-radius:10px;padding:9px 12px;margin-top:8px;display:none;line-height:1.5}
/* end screen */
#end{display:none;text-align:center}
.endcard{max-width:560px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 20px}
.trophy{font-size:58px}
.starrow{font-size:32px;letter-spacing:4px;margin:8px 0}
.recap{text-align:start;background:#f4f8fa;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 18px}
.recap .r{display:flex;gap:10px;margin-bottom:10px;font-size:12.5px;line-height:1.5}
.recap .r b{color:var(--teal)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:13px 22px;font-size:14px;font-weight:700;cursor:pointer}
.btn.p{background:var(--amber);color:#fff}
.btn.s{background:#fff;border:1.5px solid var(--teal);color:var(--teal)}
footer{text-align:center;font-size:11.5px;color:#8a97a3;margin-top:26px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 id="ttl">Mission Quest 🚀</h1>
    <div>
      <a class="back" id="backBtn" href="#">←</a>
      <button class="lang" id="langBtn">العربية</button>
    </div>
  </div>
  <div class="xpbar">
    <b id="lvlName"></b>
    <div class="meter"><i id="xpFill" style="width:0%"></i></div>
    <span id="xpTxt" style="font-size:12.5px;color:#5c6b7a"></span>
  </div>

  <div id="home">
    <p style="font-size:13.5px;color:#5c6b7a;margin-bottom:16px" id="pickGenre"></p>
    <div class="cards" id="genreCards"></div>
    <div class="banner" id="genNote"></div>
  </div>

  <div id="topicSel" style="display:none">
    <p style="font-size:13.5px;color:#5c6b7a;margin-bottom:16px" id="pickTopic"></p>
    <div class="cards" id="topicCards"></div>
  </div>

  <div id="play">
    <div class="hud">
      <div class="box" id="hudP"></div>
      <div class="box" id="hudHearts"></div>
      <div class="box" id="hudScore"></div>
    </div>
    <canvas id="cv" width="800" height="460"></canvas>
    <p class="hint" id="ctlHint"></p>
  </div>

  <div id="end">
    <div class="endcard">
      <div class="trophy" id="endEmoji">🏆</div>
      <h2 id="endTitle" style="color:var(--navy)"></h2>
      <div class="starrow" id="endStars"></div>
      <div style="font-size:14px;color:#5c6b7a;margin-bottom:14px" id="endScore"></div>
      <div class="recap" id="recap"></div>
      <div class="btns">
        <button class="btn p" id="againBtn"></button>
        <button class="btn s" id="homeBtn"></button>
      </div>
    </div>
  </div>
  <footer>Mission Quest — Adventure & Racing training games · Prepared by Clark, Joseph's assistant · September 2026</footer>
</div>

<div class="overlay" id="overlay">
  <div class="qcard">
    <span class="gate" id="gateTag"></span>
    <div class="q" id="gateQ"></div>
    <div id="gateOpts"></div>
    <div class="fbn" id="gateFbn"></div>
  </div>
</div>

<script>
/* ============ i18n ============ */
let lang='en';
const T={
 ttl:{en:"Mission Quest 🚀",ar:"مهمة كويست 🚀"},
 pickGenre:{en:"Choose your game type — each is a different mission:",ar:"اختر نوع اللعبة — كل واحدة مهمة مختلفة:"},
 pickTopic:{en:"Now pick the mission topic:",ar:"الآن اختر موضوع المهمة:"},
 genNote:{en:"💡 In production the AI bot builds a fresh mission from ANY topic — operations, competences, safety, brand standards — with new questions every time.",ar:"💡 في التطبيق الفعلي يبني البوت الذكي مهمة جديدة من أي موضوع — عمليات، كفاءات، سلامة، معايير العلامة — بأسئلة جديدة في كل مرة."},
 hearts:{en:"Hearts",ar:"المحاولات"},
 score:{en:"Score",ar:"النقاط"},
 mission:{en:"Mission",ar:"المهمة"},
 gateP:{en:"🚪 Checkpoint — answer to open the door",ar:"🚪 نقطة تفتيش — أجب لتفتح البوابة"},
 gateR:{en:"🏁 Pit stop — answer for a nitro boost",ar:"🏁 توقف — أجب للحصول على دفعة سرعة"},
 fbn:{en:"Not quite — remember: ",ar:"ليست الإجابة — تذكر: "},
 ctlP:{en:"Jump: tap the screen / press ↑ · Collect coins, dodge crates, answer at every door 🚪",ar:"القفز: اضغط على الشاشة أو ↑ · اجمع العملات، تجنب الصناديق، وأجب عند كل بوابة 🚪"},
 ctlR:{en:"Steer: swipe up/down or ↑ ↓ · Dodge the cones, answer at pit stops 🏁",ar:"التوجيه: اسحب لأعلى/لأسفل أو ↑ ↓ · تجنب الأقماع وأجب عند التوقفات 🏁"},
 endWin:{en:"Mission complete! 🎉",ar:"أكملت المهمة! 🎉"},
 endLose:{en:"Out of hearts — try again! 💪",ar:"انتهت المحاولات — جرب مرة أخرى! 💪"},
 learned:{en:"What you learned on this mission",ar:"ماذا تعلمت في هذه المهمة"},
 again:{en:"Play again",ar:"العب مرة أخرى"},
 home:{en:"Back to games",ar:"رجوع للألعاب"},
 prog:{en:"Progress",ar:"التقدم"}
};
const LEVELS=[[0,"Kitchen Rookie","مساعد المطبخ"],[300,"Line Cook","طاهي الخط"],[700,"Sous Chef","سو شيف"],[1200,"Head Chef","الشيف الأول"],[2000,"Training Legend","أسطورة التدريب"]];

/* ============ genres & topics ============ */
const GENRES=[
 {id:"adv",emo:"🗺️",cls:"g1",name:{en:"Adventure",ar:"مغامرة"},desc:{en:"Mario-style side-scroller: run, jump, collect coins — doors open only when you answer right.",ar:"لعبة قفز وتحرك: اجري واقفز واجمع العملات — الأبواب تفتح فقط إذا أجبت صح."}},
 {id:"race",emo:"🏎️",cls:"g2",name:{en:"Racing",ar:"سباق"},desc:{en:"Full-speed racer: dodge traffic, pit stops quiz you — right answers give nitro boosts.",ar:"سباق سريع: تفادى العوائق، والتوقفات تختبرك — الإجابة الصحيحة تعطيك دفعة سرعة."}}
];
const TOPICS=[
 {id:"ops",emo:"🏪",cls:"t1",name:{en:"Operations",ar:"العمليات"},qs:[
  {q:{en:"What happens to leftover food at closing?",ar:"ماذا يحدث للطعام المتبقي عند الإغلاق؟"},opts:[{t:{en:"Label + date it",ar:"ملصق + تاريخ"},ok:1},{t:{en:"Leave it open",ar:"أتركه مفتوحًا"},ok:0},{t:{en:"Mix it together",ar:"أخلطه"},ok:0}],learn:{en:"Wrap, label and date all leftover food before closing.",ar:"غلّف وسمّز وتاريخ كل الطعام المتبقي قبل الإغلاق."}},
  {q:{en:"Cash at closing is counted with…",ar:"النقدية عند الإغلاق تُعد مع…"},opts:[{t:{en:"Supervisor + signed log",ar:"المشرف + سجل موقع"},ok:1},{t:{en:"Just you alone",ar:"وحدك فقط"},ok:0},{t:{en:"The morning team",ar:"فريق الصباح"},ok:0}],learn:{en:"Back-count cash with the shift supervisor and sign the log.",ar:"إعادة عد النقدية مع مشرف الوردية والتوقيع في السجل."}},
  {q:{en:"Fryers at end of day must be…",ar:"القلايات في نهاية اليوم يجب أن…"},opts:[{t:{en:"Filtered",ar:"تُصفّى"},ok:1},{t:{en:"Left on",ar:"تبقى شغالة"},ok:0},{t:{en:"Covered only",ar:"تُغطى فقط"},ok:0}],learn:{en:"Fryers filtered, grills cooled, hot-holding off before closing.",ar:"القلايات تُصفّى، الشوايات تُبرد، والحفظ الساخن يُطفأ قبل الإغلاق."}},
  {q:{en:"Delivery rider waits more than 10 minutes. You…",ar:"مندوب التوصيل ينتظر أكثر من ١٠ دقائق. أنت…"},opts:[{t:{en:"Notify supervisor",ar:"أبلغ المشرف"},ok:1},{t:{en:"Ignore him",ar:"أتجاهله"},ok:0},{t:{en:"Apologize later",ar:"أعتذر لاحقًا"},ok:0}],learn:{en:"If a rider waits more than 10 minutes, notify the shift supervisor.",ar:"إذا انتظر المندوب أكثر من ١٠ دقائق، أبلغ مشرف الوردية."}},
  {q:{en:"Before clocking out, the last step is…",ar:"قبل إنهاء الدوام، آخر خطوة هي…"},opts:[{t:{en:"Temperature log",ar:"سجل الحرارة"},ok:1},{t:{en:"Check your phone",ar:"أفحص هاتفي"},ok:0},{t:{en:"Eat dinner",ar:"أتعشى"},ok:0}],learn:{en:"The final temperature log is the last thing before clocking out.",ar:"سجل درجات الحرارة الأخير هو آخر شيء قبل إنهاء الدوام."}}]},
 {id:"comp",emo:"⭐",cls:"t2",name:{en:"Competences",ar:"الكفاءات"},qs:[
  {q:{en:"First step when a guest complains?",ar:"أول خطوة عند شكوى الضيف؟"},opts:[{t:{en:"Listen fully",ar:"استمع للنهاية"},ok:1},{t:{en:"Explain policy",ar:"أشرح السياسة"},ok:0},{t:{en:"Call security",ar:"أنادي الأمن"},ok:0}],learn:{en:"Listen first — let the guest finish, never interrupt (L.A.S.T).",ar:"استمع أولًا — دع الضيف يكمل ولا تقاطعه (L.A.S.T)."}},
  {q:{en:"A guest is upset and loud. You…",ar:"ضيف غاضب وصوته عالٍ. أنت…"},opts:[{t:{en:"Stay calm + call supervisor",ar:"أبقى هادئًا وأنادي المشرف"},ok:1},{t:{en:"Shout back",ar:"أرد بصوت أعلى"},ok:0},{t:{en:"Walk away",ar:"أبتعد"},ok:0}],learn:{en:"Stay calm and call the shift supervisor immediately.",ar:"ابقَ هادئًا ونادِ مشرف الوردية فورًا."}},
  {q:{en:"After solving the problem, you…",ar:"بعد حل المشكلة، أنت…"},opts:[{t:{en:"Thank the guest",ar:"أشكر الضيف"},ok:1},{t:{en:"Turn around",ar:"أستدير وامشي"},ok:0},{t:{en:"Explain who was wrong",ar:"أوضح من أخطأ"},ok:0}],learn:{en:"End by thanking the guest for telling us.",ar:"أنهِ بشكر الضيف على إبلاغنا."}},
  {q:{en:"Team member does something great. You…",ar:"زميلك قام بعمل رائع. أنت…"},opts:[{t:{en:"Give kudos publicly",ar:"أمدحه أمام الجميع"},ok:1},{t:{en:"Keep it private",ar:"أبقي الأمر لنفسي"},ok:0},{t:{en:"Tell him later… maybe",ar:"أخبره لاحقًا… ربما"},ok:0}],learn:{en:"Recognize great work publicly — it costs nothing and builds the team.",ar:"امدح العمل الرائع أمام الجميع — لا يكلف شيئًا ويبني الفريق."}},
  {q:{en:"During a rush, a new joiner looks lost. You…",ar:"في وقت الذروة، موظف جديد يبدو تائهًا. أنت…"},opts:[{t:{en:"Guide them on one task",ar:"أوجهه على مهمة واحدة"},ok:1},{t:{en:"Ignore — too busy",ar:"أتجاهل — لا وقت"},ok:0},{t:{en:"Send them home",ar:"أرسله للبيت"},ok:0}],learn:{en:"Coach new joiners on one task at a time during rush.",ar:"درّب الموظفين الجدد على مهمة واحدة كل مرة وقت الذروة."}}]},
 {id:"safety",emo:"🛡️",cls:"t3",name:{en:"Safety",ar:"السلامة"},qs:[
  {q:{en:"Max temperature for the ready-to-eat fridge?",ar:"أقصى حرارة لثلاجة الأطعمة الجاهزة؟"},opts:[{t:{en:"5°C",ar:"٥°C"},ok:1},{t:{en:"10°C",ar:"١٠°C"},ok:0},{t:{en:"15°C",ar:"١٥°C"},ok:0}],learn:{en:"Ready-to-eat food is stored at 5°C or below (SOP FS-04).",ar:"الأطعمة الجاهزة تُحفظ عند ٥ درجات أو أقل (FS-04)."}},
  {q:{en:"Minimum handwashing time?",ar:"الحد الأدنى لغسل اليدين؟"},opts:[{t:{en:"20 seconds",ar:"٢٠ ثانية"},ok:1},{t:{en:"5 seconds",ar:"٥ ثوان"},ok:0},{t:{en:"No need with gloves",ar:"لا داعي مع القفازات"},ok:0}],learn:{en:"20 seconds minimum, scrubbing between fingers (SOP FS-02).",ar:"٢٠ ثانية على الأقل مع فرك بين الأصابع (FS-02)."}},
  {q:{en:"Raw meat is stored…",ar:"اللحوم النيئة تُحفظ…"},opts:[{t:{en:"Bottom shelf",ar:"في الرف السفلي"},ok:1},{t:{en:"Top shelf",ar:"في الرف العلوي"},ok:0},{t:{en:"Anywhere",ar:"في أي مكان"},ok:0}],learn:{en:"Raw meat always on the bottom shelf, below ready-to-eat food.",ar:"اللحوم النيئة دائمًا في الرف السفلي أسفل الأطعمة الجاهزة."}},
  {q:{en:"A guest mentions an allergy. You…",ar:"ضيف يذكر حساسية. أنت…"},opts:[{t:{en:"Tell the supervisor",ar:"أبلغ المشرف"},ok:1},{t:{en:"Guess the safe items",ar:"أخمّن الأصناف الآمنة"},ok:0},{t:{en:"Say 'it's fine'",ar:"أقول «لا مشكلة»"},ok:0}],learn:{en:"Never guess with allergies — always tell the shift supervisor.",ar:"لا تخمّن مع الحساسية أبدًا — بلغ مشرف الوردية دائمًا."}},
  {q:{en:"You see a small spill on the floor. You…",ar:"ترى بقعة على الأرض. أنت…"},opts:[{t:{en:"Clean + wet floor sign",ar:"أنظف وأضع لافتة أرضية مبللة"},ok:1},{t:{en:"Step over it",ar:"أقفز فوقها"},ok:0},{t:{en:"Leave for the cleaner",ar:"أتركها للعامل"},ok:0}],learn:{en:"Clean spills immediately and put up the wet floor sign.",ar:"نظف البقع فورًا وضع لافتة الأرضية المبللة."}}]}
];

/* ============ shared state ============ */
let SAVE=JSON.parse(localStorage.getItem('lq_save')||'{"xp":0,"stars":{}}');
function saveGame(){localStorage.setItem('lq_save',JSON.stringify(SAVE))}
function renderXP(){let lv=LEVELS[0];for(const l of LEVELS)if(SAVE.xp>=l[0])lv=l;const nxt=LEVELS[LEVELS.indexOf(lv)+1];
 const pct=nxt?Math.min(100,(SAVE.xp-lv[0])/(nxt[0]-lv[0])*100):100;
 document.getElementById('lvlName').textContent=lv[lang==='ar'?2:1];
 document.getElementById('xpFill').style.width=pct+'%';
 document.getElementById('xpTxt').textContent=SAVE.xp+' XP'}
let genre=null,topic=null;

/* ============ navigation ============ */
function show(id){['home','topicSel','play','end'].forEach(s=>document.getElementById(s).style.display=s===id?(s==='play'?'block':'block'):'none')}
function renderGenres(){const b=document.getElementById('genreCards');b.innerHTML='';
 GENRES.forEach(g=>{const c=document.createElement('div');c.className='card '+g.cls;
  c.innerHTML='<div class="emo">'+g.emo+'</div><h3>'+g.name[lang]+'</h3><p>'+g.desc[lang]+'</p>';
  c.onclick=()=>{genre=g;show('topicSel');renderTopics()};b.appendChild(c)})}
function renderTopics(){const b=document.getElementById('topicCards');b.innerHTML='';
 TOPICS.forEach(t=>{const c=document.createElement('div');c.className='card '+t.cls;
  c.innerHTML='<div class="emo">'+t.emo+'</div><h3>'+t.name[lang]+'</h3><p>'+(lang==='ar'?'٥ أسئلة تعليمية داخل اللعبة':'5 learning checkpoints inside the game')+'</p>';
  c.onclick=()=>startGame();b.appendChild(c)})}
document.getElementById('langBtn').onclick=()=>{lang=lang==='en'?'ar':'en';
 document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 document.getElementById('langBtn').textContent=lang==='ar'?'English':'العربية';
 document.getElementById('ttl').textContent=T.ttl[lang];
 document.getElementById('pickGenre').textContent=T.pickGenre[lang];
 document.getElementById('pickTopic').textContent=T.pickTopic[lang];
 document.getElementById('genNote').textContent=T.genNote[lang];
 renderGenres();renderXP()};
document.getElementById('backBtn').onclick=(e)=>{e.preventDefault();
 if(document.getElementById('topicSel').style.display==='block'){show('home')}
 else if(document.getElementById('play').style.display==='block'){stopLoop();show('home')}
 else if(document.getElementById('end').style.display==='block'){stopLoop();show('home')}};
renderGenres();renderXP();
document.getElementById('genNote').textContent=T.genNote[lang];

/* ============ canvas ============ */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=800,H=460,GROUND=388;
let G=null,raf=null,paused=false;
function stopLoop(){if(raf){cancelAnimationFrame(raf);raf=null}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function updateHUD(){document.getElementById('hudP').textContent=T.mission[lang]+': '+Math.round(G.prog)+'%';
 document.getElementById('hudHearts').textContent='❤️'.repeat(G.hearts)+'🤍'.repeat(3-G.hearts);
 document.getElementById('hudScore').textContent=T.score[lang]+': '+G.score}
function burst(x,y){for(let i=0;i<24;i++)G.confetti.push({x,y,vx:(Math.random()-.5)*6,vy:-Math.random()*5-1,c:['#fca311','#0f4c5c','#2a9d5c','#d1495b','#2563eb'][i%5],s:4+Math.random()*4,life:55})}
function clouds(t,spd){ctx.fillStyle='rgba(255,255,255,.85)';
 for(let i=0;i<3;i++){const cx=((t/spd)+i*300)%(W+220)-110;const cy=50+((i*71)%60);
  ctx.beginPath();ctx.arc(cx,cy,22,0,7);ctx.arc(cx+24,cy,16,0,7);ctx.arc(cx-24,cy+4,14,0,7);ctx.fill()}}

/* ============ question gates ============ */
function askGate(q,onDone){
 paused=true;
 document.getElementById('gateTag').textContent=(genre.id==='adv'?T.gateP:T.gateR)[lang];
 document.getElementById('gateQ').textContent=q.q[lang];
 const box=document.getElementById('gateOpts');box.innerHTML='';
 const fb=document.getElementById('gateFbn');fb.style.display='none';
 let done=false;
 shuffle(q.opts).forEach(o=>{
  const b=document.createElement('button');b.className='opt';b.textContent=o.t[lang];
  b.onclick=()=>{
   if(done)return;
   if(o.ok){done=true;b.classList.add('right');
    setTimeout(()=>{document.getElementById('overlay').style.display='none';paused=false;onDone(true)},450)}
   else{b.classList.add('wrong');G.hearts--;G.streak=0;updateHUD();
    fb.textContent=(T.fbn[lang])+q.learn[lang];fb.style.display='block';
    if(G.hearts<=0){done=true;setTimeout(()=>{document.getElementById('overlay').style.display='none';paused=false;endGame(false)},600)}}
  };box.appendChild(b)});
 document.getElementById('overlay').style.display='flex';
}

/* ============ start / end ============ */
function startGame(){
 show('play');document.getElementById('backBtn').style.display='inline-block';
 document.getElementById('ctlHint').textContent=(genre.id==='adv'?T.ctlP:T.ctlR)[lang];
 if(genre.id==='adv')startAdv();else startRace();
}
function endGame(win){
 stopLoop();
 document.getElementById('play').style.display='none';
 const e=document.getElementById('end');e.style.display='block';
 const stars=win?Math.max(1,G.hearts):0;
 document.getElementById('endEmoji').textContent=win?'🏆':'💪';
 document.getElementById('endTitle').textContent=win?T.endWin[lang]:T.endLose[lang];
 document.getElementById('endStars').textContent='⭐'.repeat(stars)+'✩'.repeat(3-stars);
 document.getElementById('endScore').textContent=(lang==='ar'?'النقاط: ':'Score: ')+G.score+(win?' · +'+G.score+' XP':'');
 if(win){SAVE.xp+=G.score;const k=genre.id+'-'+topic.id;SAVE.stars[k]=Math.max(SAVE.stars[k]||0,stars);saveGame();renderXP()}
 let h='<b>'+(lang==='ar'?'ماذا تعلمت في هذه المهمة:':'What you learned on this mission:')+'</b><br><br>';
 (win?topic.qs:topic.qs.slice(0,G.gi)).forEach((q,i)=>{h+='<div class="r"><span>'+(i+1)+'.</span><span><b>'+q.q[lang]+'</b><br>'+q.learn[lang]+'</span></div>'});
 document.getElementById('recap').innerHTML=h;
 document.getElementById('againBtn').textContent=T.again[lang];
 document.getElementById('homeBtn').textContent=T.home[lang];
}
document.getElementById('againBtn').onclick=()=>startGame();
document.getElementById('homeBtn').onclick=()=>{stopLoop();show('home');document.getElementById('backBtn').style.display='none'};

/* ============ ADVENTURE ============ */
function startAdv(){
 G={hearts:3,score:0,streak:0,gi:0,prog:0,wx:0,confetti:[],
    py:GROUND,vy:0,inv:0,coins:[],crates:[],doors:[],t0:performance.now()};
 const spacing=520;
 let x=900;
 topic.qs.forEach((q,i)=>{const dx=x+spacing;G.doors.push({x:dx,q,open:false});
  const nC=3+Math.floor(Math.random()*2);
  for(let j=0;j<nC;j++){const cx=x+80+j*(90+Math.random()*70);
   if(Math.random()<.6)G.coins.push({x:cx,y:GROUND-90-Math.random()*50,got:0});
   else G.crates.push({x:cx,w:34,h:34})}
  x=dx+460});
 const total=G.doors[G.doors.length-1].x+200;
 G.total=total;
 cancelAnimationFrame(raf);loopAdv();
}
const SPD=3.4,GRAV=.55,JUMP=-12.5;
window.addEventListener('keydown',e=>{if(genre&&genre.id==='adv'&&(e.key==='ArrowUp'||e.key===' ')&&G&&!paused)tryJump()});
cv.addEventListener('pointerdown',()=>{if(genre&&genre.id==='adv'&&G&&!paused)tryJump()});
function tryJump(){if(G.py>=GROUND-1){G.vy=JUMP}}
function loopAdv(){
 raf=requestAnimationFrame(loopAdv);
 if(paused){return}
 const t=performance.now();
 G.wx+=SPD;G.prog=Math.min(100,G.wx/G.total*100);
 /* physics */
 G.vy+=GRAV;G.py+=G.vy;if(G.py>GROUND){G.py=GROUND;G.vy=0}
 if(G.inv>0)G.inv--;
 /* world */
 const px=140,bot=G.py,sx=(o)=>o.x-G.wx;
 G.coins.forEach(c=>{if(!c.got&&Math.abs(sx(c)-px)<34&&Math.abs(c.y-(bot-26))<44){c.got=1;G.score+=10;G.streak++;burst(sx(c),c.y)}});
 if(G.inv<=0)for(const cr of G.crates){const cx=sx(cr);
  if(cx<px+20&&cx+cr.w>px-16&&bot>GROUND-cr.h+4){G.inv=60;G.hearts--;G.streak=0;burst(px,bot-40);updateHUD();if(G.hearts<=0)return endGame(false);break}}
 /* door */
 const d=G.doors[G.gi];
 if(d){const dx=sx(d);
  if(dx<=px+18&&!d.open){d.open=true;askGate(d.q,(ok)=>{if(ok){G.score+=100+G.streak*20;G.gi++;updateHUD();
    if(G.gi>=G.doors.length)setTimeout(()=>endGame(true),400)}})}}
 if(G.wx>=G.total&&G.gi>=G.doors.length)return endGame(true);
 updateHUD();
 /* ---- draw ---- */
 ctx.clearRect(0,0,W,H);
 const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#bfe9f7');sky.addColorStop(1,'#eafaf0');
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 clouds(t,1.1);
 /* hills parallax */
 ctx.fillStyle='#a8dcc5';
 for(let i=0;i<6;i++){const hx=((i*260)-(G.wx*.4)%(W+260)+W+260)%(W+260)-130;
  ctx.beginPath();ctx.arc(hx,GROUND+60,110,Math.PI,0);ctx.fill()}
 ctx.fillStyle='#8fd0b4';
 for(let i=0;i<6;i++){const hx=((i*260+130)-(G.wx*.7)%(W+260)+W+260)%(W+260)-130;
  ctx.beginPath();ctx.arc(hx,GROUND+80,90,Math.PI,0);ctx.fill()}
 /* ground */
 ctx.fillStyle='#6db86e';ctx.fillRect(0,GROUND+30,W,H-GROUND-30);
 ctx.fillStyle='#8a5a3b';ctx.fillRect(0,GROUND,W,30);
 ctx.fillStyle='#7a4e33';
 for(let i=0;i<30;i++){const tx=(i*40-(G.wx%40));ctx.fillRect(tx,GROUND+12,22,5)}
 /* crates */
 ctx.font='34px serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';
 G.crates.forEach(cr=>{const cx=sx(cr);if(cx>-50&&cx<W+50)ctx.fillText('📦',cx,GROUND+2)});
 /* coins */
 G.coins.forEach(c=>{if(c.got)return;const cx=sx(c);if(cx>-30&&cx<W+30){
  ctx.save();ctx.translate(cx,c.y+Math.sin(t/200+c.x)*4);ctx.font='26px serif';ctx.fillText('🪙',0,0);ctx.restore()}});
 /* doors */
 G.doors.forEach((dd,i)=>{const cx=sx(dd);if(cx>-60&&cx<W+60){
  ctx.save();if(i===G.gi)ctx.globalAlpha=1;else if(i<G.gi)ctx.globalAlpha=.45;else ctx.globalAlpha=1;
  ctx.font='52px serif';ctx.fillText(dd.open?'🌟':'🚪',cx,GROUND-6);
  if(i===G.gi){ctx.font='bold 13px Segoe UI';ctx.fillStyle='#0d1b2a';ctx.fillText('❓',cx,GROUND-64)}
  ctx.restore()}});
 /* player */
 ctx.save();
 if(G.inv>0&&Math.floor(t/80)%2)ctx.globalAlpha=.4;
 ctx.font='44px serif';ctx.fillText('🧑‍🍳',px,bot+4);
 ctx.restore();
 /* confetti */
 G.confetti=G.confetti.filter(p=>p.life>0);
 G.confetti.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.life--;
  ctx.globalAlpha=Math.min(1,p.life/30);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s);ctx.globalAlpha=1});
}

/* ============ RACING ============ */
const LANES=[218,306,394];
function startRace(){
 G={hearts:3,score:0,streak:0,gi:0,prog:0,confetti:[],lane:1,carY:LANES[1],
    obstacles:[],gate:null,nitro:0,spawn:0,t0:performance.now(),dist:0,totalDist:0};
 let x=1000;
 topic.qs.forEach((q)=>{const gx=x;
  for(let j=0;j<4;j++){G.obstacles.push({x:gx-500+j*130,lane:Math.floor(Math.random()*3),kind:'cone'})}
  G.obstacles.push({x:gx,lane:G.gi,type:'gate',q});x+=1150});
 G.totalDist=x+300;
 cancelAnimationFrame(raf);loopRace();
}
window.addEventListener('keydown',e=>{if(genre&&genre.id==='race'&&G&&!paused){
 if(e.key==='ArrowUp')setLane(G.lane-1);if(e.key==='ArrowDown')setLane(G.lane+1)}});
let touchY=null;
cv.addEventListener('pointerdown',e=>{touchY=e.clientY;if(genre&&genre.id==='race'&&G&&!paused){
 const r=cv.getBoundingClientRect();const up=e.clientY<r.top+r.height/2;setLane(G.lane+(up?-1:1))}});
function setLane(n){G.lane=Math.max(0,Math.min(2,n))}
function loopRace(){
 raf=requestAnimationFrame(loopRace);
 if(paused)return;
 const t=performance.now();
 const spd=G.nitro>0?9:4.6;G.nitro--;
 G.dist+=spd;G.prog=Math.min(100,G.dist/G.totalDist*100);
 G.carY+=(LANES[G.lane]-G.carY)*.25;
 /* obstacles */
 for(const o of G.obstacles){o.x-=spd;
  if(o.type==='gate'){if(!o.done&&o.x<=170){o.done=true;
    askGate(o.q,(ok)=>{if(ok){G.nitro=140;G.score+=100+G.streak*20;G.streak++;G.gi++;burst(170,G.carY);
      if(G.gi>=topic.qs.length){/* keep driving to finish */}}})}}
  else if(!o.hit&&Math.abs(o.x-165)<42&&o.lane===G.lane&&G.nitro<=0){
   o.hit=1;G.hearts--;G.streak=0;burst(o.x,LANES[o.lane]);updateHUD();
   if(G.hearts<=0)return endGame(false)}}
 G.obstacles=G.obstacles.filter(o=>o.x>-100);
 if(G.gi>=topic.qs.length&&G.dist>=G.totalDist-400)return endGame(true);
 updateHUD();
 /* ---- draw ---- */
 ctx.clearRect(0,0,W,H);
 const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#ffd9a0');sky.addColorStop(.5,'#ffe9c2');sky.addColorStop(1,'#fff');
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 ctx.font='40px serif';ctx.fillText('☀️',700,52);
 /* road */
 ctx.fillStyle='#555';ctx.fillRect(0,150,W,290);
 ctx.fillStyle='#3c3c3c';
 for(let i=0;i<20;i++){const ty=((i*90)-(G.dist*1.2)%90)+150;if(ty<440)ctx.fillRect(0,ty,W,3)}
 /* lane markers */
 ctx.strokeStyle='#f7d34e';ctx.setLineDash([26,26]);ctx.lineDashOffset=-(G.dist*1.2)%52;
 [184,272,360].forEach(ly=>{ctx.beginPath();ctx.moveTo(0,ly+18);ctx.lineTo(W,ly+18);ctx.stroke()});
 ctx.setLineDash([]);
 /* gates */
 ctx.textAlign='center';
 G.obstacles.forEach(o=>{if(o.type==='gate'&&o.x>-80&&o.x<W+80){
  ctx.save();ctx.font='46px serif';ctx.fillText(o.done?'✅':'🏁',o.x,LANES[1]-40);ctx.restore()}});
 /* cones */
 G.obstacles.forEach(o=>{if(o.type!=='gate'&&o.x>-40&&o.x<W+40){
  ctx.font='34px serif';ctx.fillText(o.hit?'💨':'🚧',o.x,LANES[o.lane]+28)}});
 /* car */
 ctx.save();ctx.font='46px serif';
 if(G.nitro>0){ctx.fillText('💥',125,G.carY+8);ctx.fillText('🔥',108,G.carY+18)}
 ctx.fillText('🏎️',160,G.carY+10);ctx.restore();
 /* nitro bar */
 if(G.nitro>0){ctx.fillStyle='rgba(15,76,92,.8)';ctx.fillRect(20,20,180,10);
  ctx.fillStyle='#fca311';ctx.fillRect(20,20,180*Math.min(1,G.nitro/140),10);
  ctx.fillStyle='#fff';ctx.font='bold 12px Segoe UI';ctx.fillText('NITRO!',210,30)}
 /* confetti */
 G.confetti=G.confetti.filter(p=>p.life>0);
 G.confetti.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.life--;
  ctx.globalAlpha=Math.min(1,p.life/30);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s);ctx.globalAlpha=1});
}
